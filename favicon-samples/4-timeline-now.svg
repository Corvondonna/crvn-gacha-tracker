<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0d0d0d"/>
  <!-- month grid hints -->
  <line x1="16" y1="8" x2="16" y2="56" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="48" y1="8" x2="48" y2="56" stroke="#2a2a2a" stroke-width="2"/>
  <!-- today marker -->
  <line x1="32" y1="6" x2="32" y2="58" stroke="#e84a5a" stroke-width="3"/>
  <!-- banner row line -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#3a3a3a" stroke-width="2"/>
  <!-- past node (dim circle), current node (hex), future node (diamond) -->
  <circle cx="16" cy="32" r="5" fill="#4a90e8" opacity="0.45"/>
  <polygon points="32,20 42.4,26 42.4,38 32,44 21.6,38 21.6,26"
           fill="#0d0d0d" stroke="#2dd2c6" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="48,26 54,32 48,38 42,32" fill="none" stroke="#8065e6" stroke-width="3" stroke-linejoin="round" opacity="0.85"/>
</svg>
